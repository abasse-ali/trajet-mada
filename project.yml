# Projet Xcode généré par XcodeGen (brew install xcodegen && xcodegen generate).
name: TrajetMada
options:
  bundleIdPrefix: com.trajetmada
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
packages:
  TrajetCore:
    path: Packages/TrajetCore
targets:
  TrajetMada:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TrajetCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: TrajetMada
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trajetmada.app
        PRODUCT_NAME: TrajetMada
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
