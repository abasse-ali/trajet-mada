# Teste le moteur (TrajetCore) puis construit l'app SwiftUI en .ipa NON SIGNÉ sur un Mac GitHub
# (Xcode 26, SDK iOS 26). Signez ensuite l'IPA avec Sideloadly + votre identifiant Apple.
name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Choisir la version d'Xcode la plus récente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Tests du moteur
        run: |
          set -o pipefail
          swift test --package-path Packages/TrajetCore 2>&1 | tee swift-test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-test-log
          path: swift-test.log

  serveur:
    # Vérifie le script de mise à jour des prix sur Linux, comme sur le serveur Oracle.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe de l'installateur et du script
        run: |
          bash -n server/install.sh
          python3 --version
          python3 -m py_compile server/trajetmada_update.py

      - name: Mise à jour rapide (sans clé ni publication)
        run: |
          mkdir -p /tmp/trajetmada
          OUTPUT_DIR=/tmp/trajetmada python3 server/trajetmada_update.py --quick --no-publish --config /dev/null
          python3 -c "import json; d = json.load(open('/tmp/trajetmada/trajetmada-data.json')); print(d['stats']); assert d['trainGrid'], 'grille SNCF vide'"
          cat /tmp/trajetmada/rapport.md

  ipa:
    needs: tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Choisir la version d'Xcode la plus récente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Générer le projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler l'app (Release, sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -project TrajetMada.xcodeproj \
            -scheme TrajetMada \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/TrajetMada.app

      - name: Empaqueter en .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TrajetMada.app Payload/
          zip -qry TrajetMada.ipa Payload
          ls -lh TrajetMada.ipa
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/TrajetMada.app/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: TrajetMada-ipa
          path: TrajetMada.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  simulator:
    needs: tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Choisir la version d'Xcode la plus récente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Générer le projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild \
            -project TrajetMada.xcodeproj \
            -scheme TrajetMada \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            build 2>&1 | tee xcodebuild-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build-sim/Build/Products/Debug-iphonesimulator/TrajetMada.app

      - name: Lancer l'app et capturer les écrans
        run: |
          chmod +x tools/simulator-screenshots.sh
          tools/simulator-screenshots.sh build-sim/Build/Products/Debug-iphonesimulator/TrajetMada.app screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-simulateur
          path: |
            screenshots
            xcodebuild-sim.log
